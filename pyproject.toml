[project]
name = "class-alert"
version = "0.1.3"
description = "Class timetable alerts"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Zaim Maalim Sheali", email = "rehanamahmoud48@gmail.com" },
]
dependencies = [
    "flet>=0.86.5",
    "flet-permission-handler",
    "flet-webview-all",
    "pyjnius==1.7.0",
    "android-notify",
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.5",
    "flet-desktop>=0.86.5",
    "flet-web>=0.86.5",
]

[tool.flet]
org = "Digi_Elimu.org"
product = "ClassAlert"
company = "Smart Elimu Connect"
copyright = "Copyright (C) 2026 by Digi Elimu"

[tool.flet.app]
path = "src"

[tool.flet.app.boot_screen]
show = true
message = "Preparing the app..."

[tool.flet.app.startup_screen]
show = true
message = "Loading..."

[tool.flet.splash]
color = "#ffffff"
dark_color = "#1B6911"

[tool.flet.android.permission]
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.SCHEDULE_EXACT_ALARM" = true
"android.permission.USE_EXACT_ALARM" = true
"android.permission.WAKE_LOCK" = true
"android.permission.RECEIVE_BOOT_COMPLETED" = true
"com.android.alarm.permission.SET_ALARM" = true
"android.permission.MANAGE_EXTERNAL_STORAGE" = true
