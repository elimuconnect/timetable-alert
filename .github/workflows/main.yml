name: Build Flet App

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  UV_PYTHON: "3.12"
  SERIOUS_PYTHON_VERSION: "3.12"
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # -------- Android --------
          - name: apk
            runner: ubuntu-latest
            build_cmd: "flet build apk"
            artifact_path: "build/apk"
            needs_linux_deps: false

          # Enable later after APK is working
          # - name: aab
          #   runner: ubuntu-latest
          #   build_cmd: "flet build aab"
          #   artifact_path: "build/aab"
          #   needs_linux_deps: false

          # -------- Desktop --------
          # - name: linux
          #   runner: ubuntu-latest
          #   build_cmd: "flet build linux"
          #   artifact_path: "build/linux"
          #   needs_linux_deps: true

          # - name: windows
          #   runner: windows-latest
          #   build_cmd: "flet build windows"
          #   artifact_path: "build/windows"
          #   needs_linux_deps: false

          # - name: macos
          #   runner: macos-26
          #   build_cmd: "flet build macos"
          #   artifact_path: "build/macos"
          #   needs_linux_deps: false

          # -------- iOS --------
          # - name: ipa
          #   runner: macos-26
          #   build_cmd: "flet build ipa"
          #   artifact_path: "build/ipa"
          #   needs_linux_deps: false

          # -------- Web --------
          # - name: web
          #   runner: ubuntu-latest
          #   build_cmd: "flet build web"
          #   artifact_path: "build/web"
          #   needs_linux_deps: false

    steps:
      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # PYTHON 3.12
      # ------------------------------------------------------------
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # ------------------------------------------------------------
      # VERIFY PYTHON
      # IMPORTANT:
      # Use "python --version", NOT "uv python --version".
      # ------------------------------------------------------------
      - name: Check Python version
        shell: bash
        run: |
          python --version
          python -c "import sys; print('Python executable:', sys.executable)"
          python -c "import sys; print('Python version:', sys.version)"

      # ------------------------------------------------------------
      # SETUP UV
      # ------------------------------------------------------------
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      # ------------------------------------------------------------
      # VERIFY UV + PYTHON
      # ------------------------------------------------------------
      - name: Check uv and Python
        shell: bash
        run: |
          uv --version
          uv run python --version

      # ------------------------------------------------------------
      # INSTALL LINUX DEPENDENCIES
      # ------------------------------------------------------------
      - name: Install Linux dependencies
        if: matrix.needs_linux_deps
        shell: bash
        run: |
          sudo apt update --allow-releaseinfo-change

          LINUX_DEPS="$(uv run flet --version --json | jq -r '.linux_dependencies | join(" ")')"

          if [ -n "$LINUX_DEPS" ]; then
            sudo apt-get install -y --no-install-recommends $LINUX_DEPS
          fi

          sudo apt-get clean

      # ------------------------------------------------------------
      # ACCEPT ANDROID LICENSES
      # ------------------------------------------------------------
      - name: Accept Android licenses
        if: matrix.name == 'apk' || matrix.name == 'aab'
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      # ------------------------------------------------------------
      # INSTALL PROJECT DEPENDENCIES
      # ------------------------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f "pyproject.toml" ]; then
            uv sync
          elif [ -f "requirements.txt" ]; then
            uv pip install --system -r requirements.txt
          else
            echo "No pyproject.toml or requirements.txt found."
          fi

      # ------------------------------------------------------------
      # CHECK PYTHON SOURCES
      # ------------------------------------------------------------
      - name: Check Python sources compile
        shell: bash
        run: |
          python -m compileall -q .

      # ------------------------------------------------------------
      # CHECK IMPORTANT APP FILES
      # ------------------------------------------------------------
      - name: Check Flet app files
        shell: bash
        run: |
          test -f src/main.py || {
            echo "ERROR: src/main.py not found"
            exit 1
          }

          test -f src/index.html || {
            echo "WARNING: src/index.html not found"
          }

          echo "Project files checked successfully."

      # ------------------------------------------------------------
      # BUILD FLET APP
      # ------------------------------------------------------------
      - name: Build app
        shell: bash
        run: |
          uv run ${{ matrix.build_cmd }} --yes --verbose

      # ------------------------------------------------------------
      # UPLOAD APK / BUILD ARTIFACT
      # ------------------------------------------------------------
      - name: Upload Artifact
        uses: actions/upload-artifact@v5.0.0
        with:
          name: ${{ matrix.name }}-build-artifact
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          overwrite: false
